<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" className="w-full h-full object-cover">
  <defs>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45271A" />
      <stop offset="50%" stop-color="#311B12" />
      <stop offset="100%" stop-color="#1F110B" />
    </linearGradient>
    <linearGradient id="calcBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Wood Executive Desk Surface -->
  <rect width="600" height="400" fill="url(#deskWood)" />

  <!-- Financial Statement Ledger Sheet -->
  <g transform="translate(60, 40) rotate(-4)">
    <rect width="320" height="340" rx="4" fill="#FFFFFF" opacity="0.95" />
    <!-- Header lines -->
    <rect x="25" y="30" width="180" height="12" rx="2" fill="#0F2447" />
    <rect x="25" y="50" width="120" height="6" rx="2" fill="#94A3B8" />
    <!-- Table columns -->
    <line x1="25" y1="80" x2="295" y2="80" stroke="#E2E8F0" stroke-width="2" />
    <rect x="25" y="95" width="100" height="6" rx="2" fill="#64748B" />
    <rect x="220" y="95" width="75" height="6" rx="2" fill="#2563EB" />
    <line x1="25" y1="120" x2="295" y2="120" stroke="#F1F5F9" stroke-width="1.5" />
    <rect x="25" y="135" width="130" height="6" rx="2" fill="#64748B" />
    <rect x="220" y="135" width="75" height="6" rx="2" fill="#2563EB" />
    <line x1="25" y1="160" x2="295" y2="160" stroke="#F1F5F9" stroke-width="1.5" />
    <rect x="25" y="175" width="110" height="6" rx="2" fill="#64748B" />
    <rect x="220" y="175" width="75" height="6" rx="2" fill="#2563EB" />
    <line x1="25" y1="200" x2="295" y2="200" stroke="#F1F5F9" stroke-width="1.5" />
    <!-- Green Checked Stamp -->
    <circle cx="250" cy="260" r="32" stroke="#16A34A" stroke-width="3" stroke-dasharray="4 2" fill="none" opacity="0.7" />
    <text x="224" y="265" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#16A34A" opacity="0.8">AUDITED</text>
  </g>

  <!-- Financial Calculator on Desk -->
  <g transform="translate(360, 60)">
    <!-- Chassis -->
    <rect width="190" height="280" rx="16" fill="url(#calcBezel)" stroke="#475569" stroke-width="2" />
    <!-- LCD Display -->
    <rect x="20" y="25" width="150" height="50" rx="6" fill="#84A98C" stroke="#4B6350" stroke-width="2" />
    <text x="155" y="60" text-anchor="end" font-family="'Courier New', monospace" font-weight="700" font-size="28" fill="#1B3822">58,472.30</text>
    
    <!-- Keypad Grid (4 cols x 4 rows) -->
    <!-- Row 1 -->
    <rect x="20" y="95" width="30" height="25" rx="4" fill="#334155" />
    <rect x="60" y="95" width="30" height="25" rx="4" fill="#334155" />
    <rect x="100" y="95" width="30" height="25" rx="4" fill="#334155" />
    <rect x="140" y="95" width="30" height="25" rx="4" fill="#F4C542" />

    <!-- Row 2 -->
    <rect x="20" y="130" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="60" y="130" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="100" y="130" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="140" y="130" width="30" height="25" rx="4" fill="#2563EB" />

    <!-- Row 3 -->
    <rect x="20" y="165" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="60" y="165" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="100" y="165" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="140" y="165" width="30" height="25" rx="4" fill="#2563EB" />

    <!-- Row 4 -->
    <rect x="20" y="200" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="60" y="200" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="100" y="200" width="30" height="25" rx="4" fill="#1E293B" />
    <rect x="140" y="200" width="30" height="60" rx="4" fill="#10B981" />
  </g>

  <!-- Luxury Fountain Pen Resting Across Paper -->
  <g transform="translate(180, 260) rotate(-35)">
    <rect width="220" height="12" rx="6" fill="#020617" stroke="#F4C542" stroke-width="1.5" />
    <polygon points="220,1 245,6 220,11" fill="#F4C542" />
    <circle cx="50" cy="6" r="3" fill="#F4C542" />
  </g>
</svg>
