<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none" className="w-full h-full object-cover">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2447" />
      <stop offset="50%" stop-color="#1E3A6B" />
      <stop offset="100%" stop-color="#0A1833" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5B4C" />
      <stop offset="100%" stop-color="#5C382D" />
    </linearGradient>
    <linearGradient id="goldScript" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Office Atmosphere -->
  <rect width="900" height="600" fill="url(#heroBg)" />

  <!-- City Skyline / Window view -->
  <g opacity="0.35">
    <rect x="120" y="60" width="80" height="320" fill="#2563EB" opacity="0.4" />
    <rect x="220" y="90" width="90" height="290" fill="#1D4ED8" opacity="0.3" />
    <rect x="330" y="40" width="110" height="340" fill="#3B82F6" opacity="0.35" />
    <rect x="460" y="80" width="75" height="300" fill="#1E40AF" opacity="0.3" />
    <rect x="560" y="50" width="120" height="330" fill="#2563EB" opacity="0.4" />
    <rect x="700" y="100" width="95" height="280" fill="#1D4ED8" opacity="0.3" />
    
    <!-- Window mullions -->
    <line x1="210" y1="0" x2="210" y2="400" stroke="#0F2447" stroke-width="8" opacity="0.7" />
    <line x1="450" y1="0" x2="450" y2="400" stroke="#0F2447" stroke-width="8" opacity="0.7" />
    <line x1="690" y1="0" x2="690" y2="400" stroke="#0F2447" stroke-width="8" opacity="0.7" />
    <line x1="0" y1="260" x2="900" y2="260" stroke="#0F2447" stroke-width="6" opacity="0.7" />
  </g>

  <!-- Glass partition highlight -->
  <rect x="0" y="0" width="900" height="420" fill="url(#windowGlow)" />

  <!-- Boardroom Conference Table -->
  <polygon points="50,420 850,420 900,600 0,600" fill="url(#tableGrad)" />
  <line x1="50" y1="420" x2="850" y2="420" stroke="#B45309" stroke-width="3" opacity="0.6" />

  <!-- Four Corporate Professionals Collaborating -->
  <!-- Person 1 (Senior Advisor - Left) -->
  <g>
    <!-- Chair -->
    <rect x="130" y="240" width="110" height="180" rx="16" fill="#111827" opacity="0.9" />
    <!-- Body in Navy Suit -->
    <path d="M 120 420 C 130 330 240 330 250 420 Z" fill="#1E293B" />
    <!-- White Shirt & Tie -->
    <polygon points="175,340 195,340 188,410 182,410" fill="#FFFFFF" />
    <polygon points="182,345 188,345 186,395 184,395" fill="#2563EB" />
    <!-- Head & Hair -->
    <circle cx="185" cy="290" r="34" fill="#D97706" opacity="0.7" />
    <ellipse cx="185" cy="275" rx="34" ry="20" fill="#1F2937" />
    <!-- Eyeglasses -->
    <rect x="170" y="285" width="12" height="8" rx="2" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.8" />
    <rect x="188" y="285" width="12" height="8" rx="2" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.8" />
    <line x1="182" y1="289" x2="188" y2="289" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Person 2 (Senior Partner - Center Left) -->
  <g>
    <!-- Chair -->
    <rect x="310" y="210" width="120" height="210" rx="20" fill="#0F172A" />
    <!-- Suit -->
    <path d="M 295 420 C 310 300 430 300 445 420 Z" fill="#0A1128" />
    <!-- White Collared Shirt & Gold/Navy Tie -->
    <polygon points="360,320 380,320 372,400 368,400" fill="#FFFFFF" />
    <polygon points="367,325 373,325 371,390 369,390" fill="#F4C542" />
    <!-- Head & Hair -->
    <circle cx="370" cy="265" r="36" fill="#D97706" opacity="0.75" />
    <ellipse cx="370" cy="245" rx="36" ry="22" fill="#111827" />
  </g>

  <!-- Person 3 (Female Tax Consultant - Center Right) -->
  <g>
    <!-- Chair -->
    <rect x="490" y="230" width="115" height="190" rx="18" fill="#111827" />
    <!-- Formal Blazer -->
    <path d="M 480 420 C 495 320 605 320 620 420 Z" fill="#1E293B" />
    <!-- Formal Inner Top (Blue Silk) -->
    <polygon points="540,335 560,335 554,410 546,410" fill="#3B82F6" />
    <!-- Head & Hair -->
    <circle cx="550" cy="280" r="33" fill="#D97706" opacity="0.7" />
    <ellipse cx="550" cy="265" rx="36" ry="25" fill="#0F172A" />
    <!-- Hair flowing -->
    <path d="M 515 270 Q 520 340 535 360" stroke="#0F172A" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Person 4 (Chartered Accountant - Right) -->
  <g>
    <!-- Chair -->
    <rect x="670" y="250" width="110" height="170" rx="16" fill="#111827" />
    <!-- Suit -->
    <path d="M 660 420 C 670 335 780 335 790 420 Z" fill="#1C2541" />
    <!-- Shirt -->
    <polygon points="715,345 735,345 727,410 723,410" fill="#FFFFFF" />
    <polygon points="723,350 727,350 726,400 724,400" fill="#3B82F6" />
    <!-- Head -->
    <circle cx="725" cy="295" r="33" fill="#D97706" opacity="0.7" />
    <ellipse cx="725" cy="275" rx="33" ry="20" fill="#1E293B" />
  </g>

  <!-- Laptops & Financial Ledgers on Table -->
  <!-- Laptop 1 (Person 1) -->
  <g transform="translate(190, 390)">
    <polygon points="10,20 80,20 90,45 0,45" fill="#475569" />
    <rect x="15" y="-30" width="60" height="48" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <!-- Screen chart -->
    <rect x="19" y="-26" width="52" height="40" fill="#0F172A" />
    <rect x="25" y="-10" width="8" height="20" fill="#3B82F6" />
    <rect x="37" y="-18" width="8" height="28" fill="#10B981" />
    <rect x="49" y="-6" width="8" height="16" fill="#F59E0B" />
  </g>

  <!-- Laptop 2 (Person 2 - Center) -->
  <g transform="translate(360, 385)">
    <polygon points="10,25 90,25 105,52 -5,52" fill="#64748B" />
    <rect x="12" y="-35" width="76" height="58" rx="4" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
    <rect x="16" y="-31" width="68" height="50" fill="#1E293B" />
    <!-- Data sheet lines -->
    <line x1="22" y1="-20" x2="78" y2="-20" stroke="#38BDF8" stroke-width="2" />
    <line x1="22" y1="-10" x2="78" y2="-10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="22" y1="0" x2="78" y2="0" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="22" y1="10" x2="58" y2="10" stroke="#34D399" stroke-width="2" />
  </g>

  <!-- Laptop 3 (Person 3) -->
  <g transform="translate(560, 395)">
    <polygon points="10,20 85,20 95,45 0,45" fill="#475569" />
    <rect x="15" y="-30" width="65" height="48" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <rect x="19" y="-26" width="57" height="40" fill="#0F172A" />
    <circle cx="47" cy="-6" r="14" fill="#3B82F6" opacity="0.3" stroke="#60A5FA" stroke-width="2" />
  </g>

  <!-- Documents & Ledgers on Table -->
  <g transform="translate(100, 470) rotate(-6)">
    <rect width="110" height="75" rx="3" fill="#F8FAFC" filter="url(#shadow)" />
    <line x1="15" y1="20" x2="95" y2="20" stroke="#94A3B8" stroke-width="3" />
    <line x1="15" y1="35" x2="80" y2="35" stroke="#CBD5E1" stroke-width="2" />
    <line x1="15" y1="48" x2="90" y2="48" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="85" cy="55" r="8" fill="#F4C542" opacity="0.8" />
  </g>

  <!-- High-end Glass of Water & Pen -->
  <g transform="translate(480, 470)">
    <rect width="18" height="32" rx="3" fill="#93C5FD" opacity="0.35" stroke="#FFFFFF" stroke-width="1" />
    <line x1="30" y1="10" x2="65" y2="30" stroke="#F4C542" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Top Right Cursive Badge: "Compliance Today, A Stronger Tomorrow" -->
  <g transform="translate(620, 45)" filter="url(#shadow)">
    <text x="0" y="30" font-family="'Caveat', 'Brush Script MT', cursive, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" letter-spacing="1">Compliance</text>
    <text x="35" y="65" font-family="'Caveat', 'Brush Script MT', cursive, sans-serif" font-style="italic" font-weight="600" font-size="28" fill="#F4C542">Today</text>
    <text x="4" y="105" font-family="'Caveat', 'Brush Script MT', cursive, sans-serif" font-weight="700" font-size="36" fill="#FFFFFF" letter-spacing="1">A Stronger</text>
    <text x="45" y="145" font-family="'Caveat', 'Brush Script MT', cursive, sans-serif" font-style="italic" font-weight="700" font-size="32" fill="#F4C542">Tomorrow</text>
  </g>
</svg>
