<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none" className="w-full h-full object-cover">
  <defs>
    <linearGradient id="calDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="calShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Office Background -->
  <rect width="600" height="450" fill="url(#calDesk)" />

  <!-- Potted Plant on Left -->
  <g transform="translate(60, 210)">
    <!-- Pot -->
    <polygon points="20,70 65,70 75,150 10,150" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <!-- Succulent Leaves -->
    <ellipse cx="42" cy="65" rx="18" ry="30" fill="#059669" />
    <ellipse cx="42" cy="55" rx="14" ry="32" fill="#10B981" />
    <ellipse cx="25" cy="60" rx="14" ry="25" fill="#34D399" transform="rotate(-30 25 60)" />
    <ellipse cx="60" cy="60" rx="14" ry="25" fill="#34D399" transform="rotate(30 60 60)" />
    <ellipse cx="42" cy="45" rx="10" ry="20" fill="#6EE7B7" />
  </g>

  <!-- Desk Tent Calendar -->
  <g transform="translate(180, 50)" filter="url(#calShadow)">
    <!-- Base Board -->
    <polygon points="30,300 330,300 300,340 60,340" fill="#94A3B8" />
    
    <!-- White Card Face -->
    <polygon points="40,40 320,40 330,300 30,300" fill="#FFFFFF" />
    
    <!-- Spiral Rings on Top -->
    <g stroke="#475569" stroke-width="3">
      <ellipse cx="60" cy="40" rx="4" ry="12" fill="none" />
      <ellipse cx="90" cy="40" rx="4" ry="12" fill="none" />
      <ellipse cx="120" cy="40" rx="4" ry="12" fill="none" />
      <ellipse cx="150" cy="40" rx="4" ry="12" fill="none" />
      <ellipse cx="180" cy="40" rx="4" ry="12" fill="none" />
      <ellipse cx="210" cy="40" rx="4" ry="12" fill="none" />
      <ellipse cx="240" cy="40" rx="4" ry="12" fill="none" />
      <ellipse cx="270" cy="40" rx="4" ry="12" fill="none" />
      <ellipse cx="300" cy="40" rx="4" ry="12" fill="none" />
    </g>

    <!-- Calendar Month Title -->
    <text x="55" y="80" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#071A3D">COMPLIANCE CALENDAR</text>
    <text x="260" y="80" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#2563EB">2025</text>
    <line x1="55" y1="95" x2="305" y2="95" stroke="#E2E8F0" stroke-width="2" />

    <!-- Calendar Days of Week -->
    <text x="65" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">M</text>
    <text x="105" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">T</text>
    <text x="145" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">W</text>
    <text x="185" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">T</text>
    <text x="225" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">F</text>
    <text x="265" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563EB">S</text>
    <text x="295" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#EF4444">S</text>

    <!-- Highlighted Due Dates -->
    <!-- 7th TDS -->
    <circle cx="105" cy="155" r="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
    <text x="100" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563EB">7</text>
    <text x="90" y="178" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#1E40AF">TDS</text>

    <!-- 11th GSTR-1 -->
    <circle cx="185" cy="155" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" />
    <text x="178" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B45309">11</text>
    <text x="168" y="178" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#B45309">GSTR-1</text>

    <!-- 20th GSTR-3B -->
    <circle cx="145" cy="210" r="14" fill="#DCFCE7" stroke="#10B981" stroke-width="2" />
    <text x="137" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">20</text>
    <text x="128" y="233" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#047857">GSTR-3B</text>

    <!-- 31st Advance Tax / ITR -->
    <circle cx="225" cy="265" r="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" />
    <text x="218" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B91C1C">31</text>
    <text x="212" y="288" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#B91C1C">ITR</text>
  </g>

  <!-- Laptop edge on right -->
  <g transform="translate(480, 220)">
    <polygon points="20,100 120,100 130,190 0,190" fill="#64748B" />
    <rect x="25" y="10" width="95" height="90" rx="3" fill="#1E293B" stroke="#94A3B8" stroke-width="2" />
  </g>
</svg>
